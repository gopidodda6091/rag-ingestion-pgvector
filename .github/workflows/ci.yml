name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_DSN: postgresql://rag:rag@localhost:5432/rag
      USE_ST_MODEL: "0"
      REDACTION_HMAC_KEY: ci-only-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: make setup PYTHON=python
      - name: Ruff
        run: make lint
      - name: Unit tests
        run: make test
      - name: Postgres + pgvector integration test
        run: make test-integration
      - name: Demo against pgvector
        run: make demo
